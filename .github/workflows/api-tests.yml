name: OrangeHRM API Automation Tests

on:
  schedule:
    # Every day at 1:00 PM Sri Lanka time (07:30 UTC)
    - cron: '30 7 * * *'

  workflow_dispatch:

jobs:
  api-tests:
    name: Run API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run API tests
        run: mvn -B clean test

      - name: List generated reports
        if: always()
        run: |
          echo "Checking generated test reports..."
          find target -maxdepth 3 -type f \
            \( -path '*/surefire-reports/*' \
            -o -path '*/allure-results/*' \) \
            -print 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OrangeHRM-API-Test-Reports
          path: |
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn
          retention-days: 14
