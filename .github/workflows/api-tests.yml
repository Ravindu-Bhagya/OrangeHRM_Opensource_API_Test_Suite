name: OrangeHRM API Automation Tests

on:
  schedule:
    # Every day at 1:00 AM Sri Lanka time (19:30 UTC the previous day; cron is UTC)
    - cron: '30 19 * * *'

  workflow_dispatch:

# Two runs against the same instance would purge each other's QA_AUT_ data,
# so a new run waits for the previous one instead of overlapping.
concurrency:
  group: orangehrm-api-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Optional repo secrets; when unset, Credentials.java falls back to its defaults
      OHRM_BASE_URL: ${{ secrets.OHRM_BASE_URL }}
      OHRM_USERNAME: ${{ secrets.OHRM_USERNAME }}
      OHRM_PASSWORD: ${{ secrets.OHRM_PASSWORD }}
      # Email delivery of results; the email step is skipped until these are set
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        run: mvn -B clean test

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build result sheet and summary
        id: summary
        if: always()
        run: |
          pip install --quiet openpyxl
          python .github/scripts/build_report.py target/allure-results target

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OrangeHRM-API-Test-Reports-${{ github.run_number }}
          path: |
            OrangeHRM-API-TestReport.pdf
            target/OrangeHRM-API-Test-Results.xlsx
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Email test results
        if: always() && env.SMTP_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: ${{ (secrets.SMTP_PORT || '465') == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: OrangeHRM API Tests <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[${{ (steps.summary.outputs.total == '0' || steps.summary.outputs.bad != '0') && 'FAILED' || 'PASSED' }}] OrangeHRM API tests: ${{ steps.summary.outputs.passed || 0 }}/${{ steps.summary.outputs.total || 0 }} passed (run #${{ github.run_number }})"
          html_body: file://target/email-body.html
          # globs, so a missing file does not break the email
          attachments: target/OrangeHRM-API-Test-Results*.xlsx,OrangeHRM-API-TestReport*.pdf

      # The pom sets testFailureIgnore=true, so Maven exits 0 even when tests fail.
      # Fail the job here (after the reports are uploaded) so failed runs show red.
      - name: Fail job on test failures
        if: always() && (steps.summary.outputs.total == '0' || steps.summary.outputs.bad != '0')
        run: |
          echo "::error::${{ steps.summary.outputs.bad }} failing test(s) out of ${{ steps.summary.outputs.total }} — see the run summary and the report artifact"
          exit 1
