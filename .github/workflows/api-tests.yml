name: OrangeHRM API Automation Tests

on:
  schedule:
    # Every day at 1:00 AM Sri Lanka time (19:30 UTC the previous day; cron is UTC)
    - cron: '30 19 * * *'

  workflow_dispatch:

# Two runs against the same instance would purge each other's QA_AUT_ data,
# so a new run waits for the previous one instead of overlapping.
concurrency:
  group: orangehrm-api-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Optional repo secrets; when unset, Credentials.java falls back to its defaults
      OHRM_BASE_URL: ${{ secrets.OHRM_BASE_URL }}
      OHRM_USERNAME: ${{ secrets.OHRM_USERNAME }}
      OHRM_PASSWORD: ${{ secrets.OHRM_PASSWORD }}
      # Email delivery of results; the email step is skipped until these are set
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        run: mvn -B clean test

      - name: Summarise results
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          t = f = e = s = 0
          failed = []
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(path).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      failed.append(f"{tc.get('classname', '').split('.')[-1]}.{tc.get('name')}")
          passed = t - f - e - s
          lines = ["## OrangeHRM API Test Results", "",
                   "| Total | Passed | Failed | Errors | Skipped |", "|---|---|---|---|---|",
                   f"| {t} | {passed} | {f} | {e} | {s} |", ""]
          if failed:
              lines += ["### Failed tests", ""] + [f"- `{n}`" for n in failed]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write("\n".join(lines) + "\n")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          os.makedirs('target', exist_ok=True)
          with open('target/email-body.md', 'w') as out:
              out.write("\n".join(lines) + f"\n[Open the run on GitHub]({run_url})\n")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"total={t}\nbad={f + e}\npassed={passed}\n")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OrangeHRM-API-Test-Reports-${{ github.run_number }}
          path: |
            OrangeHRM-API-TestReport.pdf
            target/surefire-reports/
            target/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Email test results
        if: always() && env.SMTP_PASSWORD != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: ${{ (secrets.SMTP_PORT || '465') == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: OrangeHRM API Tests <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[${{ (steps.summary.outputs.total == '0' || steps.summary.outputs.bad != '0') && 'FAILED' || 'PASSED' }}] OrangeHRM API tests: ${{ steps.summary.outputs.passed || 0 }}/${{ steps.summary.outputs.total || 0 }} passed (run #${{ github.run_number }})"
          body: file://target/email-body.md
          convert_markdown: true
          attachments: OrangeHRM-API-TestReport*.pdf   # glob, so a missing PDF does not break the email

      # The pom sets testFailureIgnore=true, so Maven exits 0 even when tests fail.
      # Fail the job here (after the reports are uploaded) so failed runs show red.
      - name: Fail job on test failures
        if: always() && (steps.summary.outputs.total == '0' || steps.summary.outputs.bad != '0')
        run: |
          echo "::error::${{ steps.summary.outputs.bad }} failing test(s) out of ${{ steps.summary.outputs.total }} — see the run summary and the report artifact"
          exit 1
